<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flight Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Flight Search</h1>

    <form id="searchForm">
        <label>
            Origin:
            <input type="text" id="origin" placeholder="SFO" required>
        </label>

        <label>
            Destination:
            <input type="text" id="destination" placeholder="NRT" required>
        </label>

        <label>
            Date:
            <input type="date" id="date" required>
        </label>

        <button type="submit">Search</button>
    </form>

    <hr>

    <div id="results"></div>

    <script src="script.js"></script>
</body>
</html>
